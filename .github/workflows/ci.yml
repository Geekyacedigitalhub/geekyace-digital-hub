name: Portfolio CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geekyace_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d geekyace_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/geekyace_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply Prisma migrations
        run: npm run db:deploy

      - name: Build
        run: npm run build
