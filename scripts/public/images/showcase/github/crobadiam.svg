<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bg_crobadiam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(45 40% 10%)"/>
      <stop offset="1" stop-color="hsl(10 40% 6%)"/>
    </linearGradient>
    <linearGradient id="accent_crobadiam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="hsl(10 85% 60%)"/>
    </linearGradient>
    <radialGradient id="glow_crobadiam" cx="70%" cy="30%" r="60%">
